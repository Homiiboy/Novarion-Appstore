<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 480" role="img" aria-labelledby="title desc">
  <title id="title">Novarion App Store</title>
  <desc id="desc">Futuristic Novarion App Store logo with a luminous N emblem and orbital accents.</desc>
  <defs>
    <linearGradient id="nova" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35F2FF"/>
      <stop offset="0.4" stop-color="#167DFF"/>
      <stop offset="0.72" stop-color="#8B38FF"/>
      <stop offset="1" stop-color="#FF50CF"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6F9FF"/>
      <stop offset="0.32" stop-color="#6DDCFF"/>
      <stop offset="0.67" stop-color="#8D78FF"/>
      <stop offset="1" stop-color="#E45BFF"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#A8FAFF"/>
      <stop offset="0.68" stop-color="#5C8CFF"/>
      <stop offset="1" stop-color="#7D39FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <g transform="translate(46 28)">
    <circle cx="205" cy="212" r="150" fill="#071324" opacity="0.92"/>
    <circle cx="205" cy="212" r="145" fill="none" stroke="url(#nova)" stroke-width="3" opacity="0.75"/>
    <ellipse cx="205" cy="212" rx="196" ry="68" fill="none" stroke="url(#nova)" stroke-width="7" transform="rotate(-18 205 212)" opacity="0.88" filter="url(#glow)"/>
    <ellipse cx="205" cy="212" rx="72" ry="192" fill="none" stroke="url(#nova)" stroke-width="4" transform="rotate(21 205 212)" opacity="0.52"/>

    <path d="M118 298V123L291 300V124" fill="none" stroke="url(#nova)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M118 298V123L291 300V124" fill="none" stroke="#D7FBFF" stroke-opacity="0.34" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="205" cy="212" r="55" fill="url(#core)" opacity="0.58" filter="url(#soft)"/>
    <path d="M205 166L214 203L251 212L214 221L205 258L196 221L159 212L196 203Z" fill="#FFFFFF" filter="url(#glow)"/>

    <circle cx="31" cy="271" r="13" fill="#40F6FF" filter="url(#glow)"/>
    <circle cx="334" cy="80" r="14" fill="#B558FF" filter="url(#glow)"/>
    <circle cx="328" cy="344" r="11" fill="#F45AD8" filter="url(#glow)"/>
  </g>

  <g transform="translate(455 0)">
    <text x="0" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="168" font-weight="800" letter-spacing="6" fill="url(#word)">NOVARION</text>
    <text x="12" y="332" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="49" font-weight="600" letter-spacing="22" fill="#DDE9FF">APP STORE</text>
    <rect x="12" y="362" width="1070" height="3" rx="2" fill="url(#nova)" opacity="0.78"/>
    <circle cx="12" cy="363.5" r="6" fill="#42F4FF" filter="url(#glow)"/>
    <circle cx="1082" cy="363.5" r="6" fill="#F255DC" filter="url(#glow)"/>
  </g>
</svg>
